<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event Display</title>
<style>
:root{--bg:#0b1222;--card:#16213a;--line:#2a3a5c;--fg:#f1f5f9;--mut:#94a3b8;--acc:#2dd4bf;--acc2:#f59e0b}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:22px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100vh;padding:3vh 4vw;display:grid;grid-template-columns:1fr 18vw;gap:3vw}
.tag{font-size:1.1rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
h1{font-size:3.2rem;line-height:1.1;margin:.2rem 0 1rem}
.meta{color:var(--mut);margin-bottom:1.6rem}
.side{display:flex;flex-direction:column;align-items:center;gap:1rem;color:var(--mut);text-align:center;font-size:1rem}
.side img{width:100%;background:#fff;border-radius:12px;padding:6px}
.row{margin-bottom:1.6rem}
.row .t{font-size:1.5rem;margin-bottom:.5rem;display:flex;justify-content:space-between;gap:1rem}
.row .t b{color:var(--acc);font-size:2rem}
.bar{height:26px;background:#0f1a31;border-radius:13px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#5eead4);transition:width .8s ease}
.dist{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px;align-items:end;height:42px}
.dist span{background:var(--line);border-radius:4px 4px 0 0;transition:height .8s ease;min-height:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.2rem 1.6rem;margin-bottom:1rem}
.sum h2{font-size:2.2rem;line-height:1.2;margin:.2rem 0 1rem}
.sum li{font-size:1.6rem;margin-bottom:.7rem}
.shim{color:var(--mut);animation:b 1.4s infinite}
@keyframes b{50%{opacity:.35}}
.tick{font-size:1.25rem;color:#cbd5e1;border-left:4px solid var(--acc);padding:.2rem 1rem;margin-bottom:.7rem}
.words span{display:inline-block;margin:.2rem .6rem;color:var(--acc)}
.ov{display:grid;grid-template-columns:repeat(auto-fill,minmax(26vw,1fr));gap:1.2rem}
.big{font-size:3.4rem;color:var(--acc);font-weight:700}
.idle{display:flex;height:100%;align-items:center;justify-content:center;color:var(--mut);font-size:2.2rem;text-align:center}
</style>
</head>
<body>
<div id="app"><div id="main"></div><div class="side" id="side"></div></div>
<script>
const $=s=>document.querySelector(s), main=$('#main'), side=$('#side');
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let struct='';
function qrSide(show,label){side.innerHTML=show?`<img src="/qr.svg" alt="QR"><div>${label}</div>`:''}

function draw(d){
  if(d.mode==='overview')return overview(d);
  const s=d.session;
  if(!s||s.status==='draft'){struct='idle';main.innerHTML='<div class="idle">Welcome. Sessions will appear here.</div>';return qrSide(true,'Scan to join')}
  qrSide(s.status==='open','Scan to take part');
  s.kind==='care'?care(s,d.stats):courage(s,d.stats);
}

function care(s,st){
  const sg='care|'+s.id+'|'+st.questions.map(q=>q.id).join();
  if(sg!==struct){
    struct=sg;
    main.innerHTML=`<div class="tag">Care</div><h1>${esc(s.title)}</h1><div class="meta" id="meta"></div>`+
      st.questions.map(q=>`<div class="row" id="r-${q.id}"><div class="t"><span>${esc(q.text)}</span><b class="avg">–</b></div><div class="bar"><i></i></div><div class="dist">${'<span></span>'.repeat(5)}</div></div>`).join('');
  }
  $('#meta').textContent=`${st.n} response${st.n===1?'':'s'}`+(st.overall?` · overall ${st.overall.toFixed(1)} / 5`:'')+(s.status==='closed'?' · closed':'');
  st.questions.forEach(q=>{
    const r=$('#r-'+q.id); if(!r)return;
    r.querySelector('.avg').textContent=q.avg==null?'–':q.avg.toFixed(1);
    r.querySelector('.bar i').style.width=q.avg==null?'0%':(q.avg/5*100)+'%';
    const mx=Math.max(1,...q.counts);
    r.querySelectorAll('.dist span').forEach((e,i)=>e.style.height=(q.counts[i]/mx*100)+'%');
  });
}

function courage(s,st){
  const sum=s.summary, sg='courage|'+s.id+'|'+s.summary_state+'|'+JSON.stringify(sum)+'|'+(st.latest||[]).join('~')+'|'+st.n;
  if(sg===struct)return; struct=sg;
  let right='';
  if(sum&&s.summary_state==='ready'){
    right=`<div class="card sum"><div class="tag">What the room said</div><h2>${esc(sum.headline)}</h2><ul>${sum.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`;
  }else if(s.summary_state==='pending'){
    right=`<div class="card shim">Summarising the room's feedback…</div>`;
  }
  const ticks=(st.latest||[]).slice(0,sum?3:6).map(t=>`<div class="tick">${esc(t)}</div>`).join('');
  const words=(st.words||[]).slice(0,10).map((w,i)=>`<span style="font-size:${1.1+Math.max(0,6-i)*.18}rem">${esc(w.word)}</span>`).join('');
  main.innerHTML=`<div class="tag">Courage</div><h1>${esc(s.title)}</h1><div class="meta">${st.n} comment${st.n===1?'':'s'}${s.status==='closed'?' · closed':''}</div>${right}${ticks}${!sum&&words?`<div class="words">${words}</div>`:''}`;
}

function overview(d){
  const sg='ov|'+JSON.stringify(d.items); if(sg===struct)return; struct=sg; qrSide(false);
  main.innerHTML=`<div class="tag">Highlights</div><h1>The day so far</h1><div class="ov">`+d.items.map(i=>i.kind==='care'
    ?`<div class="card"><div class="tag">Care</div><div style="font-size:1.4rem">${esc(i.title)}</div><div class="big">${i.overall==null?'–':i.overall.toFixed(1)}<span style="font-size:1.2rem;color:var(--mut)"> / 5 · ${i.n} votes</span></div></div>`
    :`<div class="card"><div class="tag">Courage</div><div style="font-size:1.4rem">${esc(i.title)}</div><div style="font-size:1.2rem;margin-top:.6rem">${i.summary?esc(i.summary.headline):'<span style="color:var(--mut)">'+i.n+' comments</span>'}</div></div>`).join('')+`</div>`;
}

async function tick(){
  try{const r=await fetch('/api/display',{cache:'no-store'});if(r.ok)draw(await r.json())}catch(e){}
  setTimeout(tick,2000);
}
tick();
</script>
</body>
</html>
