# Render Blueprint: New > Blueprint > pick this repo.
# POC: both plans can stay "free". For the event week, change the web plan to
# "standard" (1 CPU / 2 GB) and the database to a paid plan, redeploy, load-test, then delete after.
services:
  - type: web
    name: event-engagement
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: event-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: WORKER_TOKEN
        generateValue: true

databases:
  - name: event-db
    region: singapore
    plan: free
