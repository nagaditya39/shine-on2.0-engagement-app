<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live Event</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--fg:#f1f5f9;--mut:#94a3b8;--acc:#2dd4bf;--warn:#f59e0b}
*{box-sizing:border-box}
body{margin:0;font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;padding:env(safe-area-inset-top) 16px 40px}
main{max-width:560px;margin:0 auto;padding-top:20px}
.tag{display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
h1{font-size:24px;line-height:1.2;margin:0 0 6px}
p.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.q{font-weight:600;margin-bottom:10px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{font:inherit;font-weight:700;padding:14px 0;border-radius:10px;border:1px solid var(--line);background:#0b1222;color:var(--fg)}
.scale button.on{background:var(--acc);color:#04211d;border-color:var(--acc)}
.ends{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-top:6px}
.go{width:100%;font:inherit;font-weight:700;padding:16px;border:0;border-radius:12px;background:var(--acc);color:#04211d}
.go:disabled{opacity:.4}
textarea{width:100%;min-height:130px;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0b1222;color:var(--fg);resize:vertical}
.cnt{color:var(--mut);font-size:13px;text-align:right;margin:4px 0 12px}
.center{text-align:center;padding:60px 10px;color:var(--mut)}
.center b{display:block;color:var(--fg);font-size:22px;margin-bottom:8px}
.link{background:none;border:0;color:var(--acc);font:inherit;text-decoration:underline;padding:8px}
#net{position:fixed;left:0;right:0;top:0;background:var(--warn);color:#201400;text-align:center;font-size:14px;padding:4px}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--acc);margin:0 auto 18px;animation:p 1.6s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(45,212,191,.6)}100%{box-shadow:0 0 0 22px rgba(45,212,191,0)}}
</style>
</head>
<body>
<div id="net" hidden>Reconnecting…</div>
<main id="root"></main>
<script>
const $=s=>document.querySelector(s), root=$('#root');
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let dev=null;
try{dev=localStorage.getItem('dev')}catch(e){}
if(!dev){dev=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2,12));try{localStorage.setItem('dev',dev)}catch(e){}}
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let sig='';
async function poll(){
  try{
    const r=await fetch('/api/state',{cache:'no-store'});
    if(!r.ok)throw 0;
    const d=await r.json();
    $('#net').hidden=true;
    const s=d.active, ns=s?[s.id,s.status,s.kind,JSON.stringify(s.questions)].join('|'):'none';
    if(ns!==sig){sig=ns;render(s)}
  }catch(e){$('#net').hidden=false}
  setTimeout(poll,2500+Math.random()*1500);
}

function waiting(msg){root.innerHTML=`<div class="center"><div class="pulse"></div><b>${esc(msg||'Get ready')}</b>The next session will appear here automatically.</div>`}

function render(s){
  if(!s||s.status==='draft')return waiting();
  if(s.status==='closed')return root.innerHTML=`<div class="center"><b>Thank you!</b>This session is now closed. The next one will appear here automatically.</div>`;
  s.kind==='care'?care(s):courage(s);
}

function care(s){
  const saved=ls.get('care:'+s.id), ans=saved&&saved.a?saved.a:{};
  if(saved&&saved.done)return thanks(s,'Your ratings are in.',()=>{saved.done=false;ls.set('care:'+s.id,saved);care(s)});
  root.innerHTML=`<span class="tag">Care</span><h1>${esc(s.title)}</h1><p class="sub">Listen closely, then rate each statement from 1 to 5.</p>`+
    s.questions.map(q=>`<div class="card" data-q="${q.id}"><div class="q">${esc(q.text)}</div><div class="scale">${[1,2,3,4,5].map(n=>`<button data-v="${n}" class="${ans[q.id]===n?'on':''}">${n}</button>`).join('')}</div><div class="ends"><span>Not at all</span><span>Absolutely</span></div></div>`).join('')+
    `<button class="go" id="go">Submit</button>`;
  const go=$('#go'), check=()=>go.disabled=!s.questions.every(q=>ans[q.id]);
  check();
  root.querySelectorAll('.card').forEach(card=>card.onclick=e=>{
    const b=e.target.closest('button'); if(!b)return;
    ans[card.dataset.q]=+b.dataset.v;
    card.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    ls.set('care:'+s.id,{a:ans,done:false}); check();
  });
  go.onclick=async()=>{
    go.disabled=true;go.textContent='Sending…';
    try{
      const r=await fetch('/api/rate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:s.id,device_id:dev,answers:ans})});
      if(!r.ok)throw 0;
      ls.set('care:'+s.id,{a:ans,done:true});
      thanks(s,'Your ratings are in.',()=>{ls.set('care:'+s.id,{a:ans,done:false});care(s)});
    }catch(e){go.disabled=false;go.textContent='Try again'}
  };
}

function thanks(s,msg,undo){
  root.innerHTML=`<div class="center"><b>Thank you!</b>${esc(msg)}<br><button class="link" id="chg">Change my answers</button></div>`;
  $('#chg').onclick=undo;
}

function courage(s){
  const key='cc:'+s.id; let sent=ls.get(key)||0;
  root.innerHTML=`<span class="tag">Courage</span><h1>${esc(s.title)}</h1><p class="sub">Share what you liked or what excites you about this idea.</p>
    <textarea id="t" maxlength="280" placeholder="Your comment…"></textarea><div class="cnt"><span id="n">0</span>/280</div>
    <button class="go" id="go" disabled>Send comment</button><p class="sub" id="msg" style="margin-top:14px"></p>`;
  const t=$('#t'),go=$('#go'),msg=$('#msg');
  const refresh=()=>{$('#n').textContent=t.value.length;go.disabled=t.value.trim().length<3||sent>=3};
  t.oninput=refresh;
  if(sent>=3)msg.textContent='You have sent the maximum of 3 comments for this pitch. Thank you!';
  go.onclick=async()=>{
    go.disabled=true;go.textContent='Sending…';
    try{
      const r=await fetch('/api/comment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:s.id,device_id:dev,text:t.value})});
      if(r.status===429){sent=3;ls.set(key,3)}else if(!r.ok)throw 0;else{sent++;ls.set(key,sent);t.value='';msg.textContent=sent>=3?'Thank you! That was your last comment for this pitch.':'Sent. Thank you! You can add another.'}
    }catch(e){msg.textContent='Could not send. Please try again.'}
    go.textContent='Send comment';refresh();
  };
}
poll();
</script>
</body>
</html>
